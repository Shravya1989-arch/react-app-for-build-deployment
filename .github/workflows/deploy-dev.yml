name: Deploy DEV

on:

  push:

    branches:
      - master

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4

        with:
          node-version: 20

      - run: npm ci

      - run: npm run build

      - name: Deploy

        run: echo "Deploying DEV"