name: Deploy DEV

on:

  push:

    branches:
      - master

  workflow_run:
    workflows:
      - Build
    types:
      - completed

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment: DEV

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4

        with:
          node-version: 20

      - run: npm ci

      - run: npm run build

      - name: Deploy

        run: echo "Deploying DEV"