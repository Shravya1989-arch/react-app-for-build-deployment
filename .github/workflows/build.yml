name: Build

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    env:
      REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
      REACT_APP_AUTH_URL: ${{ secrets.REACT_APP_AUTH_URL }}

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Setup Node

        uses: actions/setup-node@v4

        with:
          node-version: 20

      - name: Install

        run: npm ci

      - name: Lint

        run: npm run lint

      # - name: Test

      #   run: npm run test -- --watchAll=false

      - name: Build

        run: npm run build

      - name: Upload Artifact

        uses: actions/upload-artifact@v4

        with:
          name: react-build
          # path: dist        as build in package.json is vite and creates a dist folder
          path: dist
          retention-days: 7